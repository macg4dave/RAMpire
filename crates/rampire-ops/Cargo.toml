[package]
name = "rampire-ops"
version = "0.6.0"
edition = "2021"
authors = ["macg4dave"]
license = "GPL-3.0-or-later"
description = "RAMpire operator commands: configuration, VM management and the live views"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
toml = "1.1.8"
toml_edit = "0.23"
quick-xml = "0.41.0"
signal-hook = "0.3"
libc = "0.2"
rampire-core = { path = "../rampire-core" }
rampire-host = { path = "../../host" }
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "layout-cache", "unstable-rendered-line-info"] }
