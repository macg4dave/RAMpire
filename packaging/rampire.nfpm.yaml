# The host package, rampire, as RPM and .deb. Built by
# packaging/build.sh, which sets VERSION, ARCH and REPO.
name: rampire
version: "${VERSION}"
arch: "${ARCH}"
platform: linux
maintainer: macg4dave
license: GPL-3.0-or-later
homepage: https://github.com/macg4dave/rampire
description: |
  RAMpire shares a pool of RAM between the VMs on a KVM host. Each guest
  asks for memory when it needs more and returns it when it has spare; the
  controller resizes the VM's virtio-mem device within the pool, the VM's
  limits and the host's own reserve.
contents:
  - src: "./target/release/rampire"
    dst: /usr/bin/rampire
    file_info: { mode: 0755 }
  - src: "./host/systemd/rampire.service"
    dst: /usr/lib/systemd/system/rampire.service
    file_info: { mode: 0644 }
  - src: "./packaging/debian-socket-group.conf"
    dst: /usr/lib/systemd/system/rampire.service.d/socket-group.conf
    file_info: { mode: 0644 }
    packager: deb
  - src: "./host/systemd/50-rampire.rules"
    dst: /usr/share/polkit-1/rules.d/50-rampire.rules
    file_info: { mode: 0644 }
  - src: "./packaging/rampire.sysusers"
    dst: /usr/lib/sysusers.d/rampire.conf
    file_info: { mode: 0644 }
  # The draft's folders. global.toml is left to `rampire init`, which never
  # overwrites one, because no example suits every host.
  - dst: /etc/rampire
    type: dir
    file_info: { mode: 0755 }
  - dst: /etc/rampire/vms.d
    type: dir
    file_info: { mode: 0755 }
  - dst: /etc/rampire/attestations
    type: dir
    file_info: { mode: 0755 }
  - src: "./deploy/examples/reviews/linux-standard.toml"
    dst: /etc/rampire/reviews/linux-standard.toml
    type: config|noreplace
    file_info: { mode: 0644 }
  - src: "./deploy/examples/global.toml"
    dst: /usr/share/doc/rampire/examples/global.toml
    file_info: { mode: 0644 }
  - src: "./deploy/examples/vms.d/linux-vm.toml"
    dst: /usr/share/doc/rampire/examples/vms.d/linux-vm.toml
    file_info: { mode: 0644 }
  # The guest packages of the same build, which `rampire vm add` installs
  # in a VM. Written by build.sh before this package is made.
  - src: "./target/packaging/guest/rampire-guest.deb"
    dst: /usr/share/rampire/guest/rampire-guest.deb
    file_info: { mode: 0644 }
  - src: "./target/packaging/guest/rampire-guest.rpm"
    dst: /usr/share/rampire/guest/rampire-guest.rpm
    file_info: { mode: 0644 }
  # What software centres such as GNOME Software show, and the launcher
  # that opens the TUI from the desktop (as root, through pkexec).
  - src: "./packaging/io.github.macg4dave.rampire.metainfo.xml"
    dst: /usr/share/metainfo/io.github.macg4dave.rampire.metainfo.xml
    file_info: { mode: 0644 }
  - src: "./packaging/io.github.macg4dave.rampire.desktop"
    dst: /usr/share/applications/io.github.macg4dave.rampire.desktop
    file_info: { mode: 0644 }
  - src: "./packaging/io.github.macg4dave.rampire.policy"
    dst: /usr/share/polkit-1/actions/io.github.macg4dave.rampire.policy
    file_info: { mode: 0644 }
  - src: "./packaging/icons/hicolor/64x64/apps/io.github.macg4dave.rampire.png"
    dst: /usr/share/icons/hicolor/64x64/apps/io.github.macg4dave.rampire.png
    file_info: { mode: 0644 }
  - src: "./packaging/icons/hicolor/128x128/apps/io.github.macg4dave.rampire.png"
    dst: /usr/share/icons/hicolor/128x128/apps/io.github.macg4dave.rampire.png
    file_info: { mode: 0644 }
  - src: "./packaging/icons/hicolor/256x256/apps/io.github.macg4dave.rampire.png"
    dst: /usr/share/icons/hicolor/256x256/apps/io.github.macg4dave.rampire.png
    file_info: { mode: 0644 }
  - src: "./packaging/icons/hicolor/512x512/apps/io.github.macg4dave.rampire.png"
    dst: /usr/share/icons/hicolor/512x512/apps/io.github.macg4dave.rampire.png
    file_info: { mode: 0644 }
  - src: "./LICENSE"
    dst: /usr/share/doc/rampire/LICENSE
    file_info: { mode: 0644 }
  # Every third-party crate's notice, written by cargo xtask licenses.
  - src: "./target/packaging/licenses/rampire.THIRD_PARTY_LICENSES"
    dst: /usr/share/doc/rampire/THIRD_PARTY_LICENSES
    file_info: { mode: 0644 }
  # Written by packaging/docs.sh from the binary's command definitions.
  - src: "./target/packaging/docs/man8/*.8.gz"
    dst: /usr/share/man/man8/
    file_info: { mode: 0644 }
  - src: "./target/packaging/docs/man5/rampire.toml.5.gz"
    dst: /usr/share/man/man5/rampire.toml.5.gz
    file_info: { mode: 0644 }
  - src: "./target/packaging/docs/completions/rampire"
    dst: /usr/share/bash-completion/completions/rampire
    file_info: { mode: 0644 }
  - src: "./target/packaging/docs/completions/_rampire"
    dst: /usr/share/zsh/site-functions/_rampire
    file_info: { mode: 0644 }
  - src: "./target/packaging/docs/completions/rampire.fish"
    dst: /usr/share/fish/vendor_completions.d/rampire.fish
    file_info: { mode: 0644 }
scripts:
  postinstall: "./packaging/scripts/host-postinstall.sh"
  preremove: "./packaging/scripts/host-preremove.sh"
  postremove: "./packaging/scripts/host-postremove.sh"
rpm:
  summary: Shares a pool of RAM between the VMs on a KVM host
overrides:
  rpm:
    depends:
      - libvirt-client
      - polkit
      - systemd
    # vm add installs the guest package with them when it can't log in.
    recommends:
      - guestfs-tools
  deb:
    depends:
      - libvirt-clients
      - polkitd
      - systemd
    recommends:
      - libguestfs-tools
