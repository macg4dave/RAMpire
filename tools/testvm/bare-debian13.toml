# A Debian 13 KVM host as the quick start expects to find it: libvirt and
# QEMU from the distribution, nothing of RAMpire installed. The packages
# built from the checkout are left in the login's home directory, standing
# in for the releases page until a repository is published. A person
# installs and sets up RAMpire from the quick start. Kept: it is a
# deployment to use and improve, not a test to remove.
description = "A Debian 13 KVM host with libvirt, ready for the quick start"
keep = true
next = "ssh in and follow docs/quick-start.md: apt install ./rampire_*_amd64.deb"
image = "https://cloud.debian.org/images/cloud/trixie/latest/debian-13-generic-amd64.qcow2"
boot_mib = 4096
vcpus = 4
disk_gib = 30
nested = true
timeout_minutes = 30
commands = [
  "apt-get install -y libvirt-daemon-system qemu-system-x86 virtinst qemu-utils",
  "install -o tester -m 0644 $SEED/rampire_*_amd64.deb $SEED/rampire-guest_*_amd64.deb /home/tester/",
  "usermod -aG libvirt tester",
  "virsh -c qemu:///system version",
]
