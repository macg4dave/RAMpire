# The guest package installed and room for a virtio-mem device, but no
# device and no control channel: what `rampire vm add --fix-xml` starts
# from. Kept, for vm add on a terminal: it asks a person.
description = "A Debian 13 guest, ready for rampire vm add --fix-xml"
keep = true
next = "sudo rampire vm add {name} --fix-xml"
image = "https://cloud.debian.org/images/cloud/trixie/latest/debian-13-generic-amd64.qcow2"
boot_mib = 1024
hotplug_mib = 4096
timeout_minutes = 20
commands = [
  "apt-get install -y $SEED/rampire-guest_*_amd64.deb",
  "systemctl is-enabled rampire-guest",
  "uname -r",
]
