# A clean Ubuntu 24.04 KVM host: libvirt from the distribution, then RAMpire's host
# package with apt, `rampire init`, and a controller running with no VMs
# (the roadmap's O2 exit). --packages builds and passes the packages:
#
#   cargo xtask testvm up tools/testvm/clean-host-ubuntu2404.toml \
#     --name clean-ubuntu2404 --packages --apply
image = "https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img"
boot_mib = 2048
disk_gib = 12
nested = true
timeout_minutes = 30
commands = [
  "apt-get install -y libvirt-daemon-system qemu-system-x86",
  "apt-get install -y $SEED/rampire_*_amd64.deb",
  # init checks the host, applies and starts the controller (quick start).
  "rampire init --yes",
  "systemctl is-active rampire",
  "systemctl is-enabled rampire",
  "rampire status",
  "rampire doctor",
]
